{# Inline SVG icons (currentColor). Usage: {% from "_icons.html" import icon %} {{ icon("play") }} #}
{% macro icon(name, size=24, cls="") -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "play" -%}
  <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor" stroke="none"/>
{%- elif name == "pause" -%}
  <rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/>
  <rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/>
{%- elif name == "back15" -%}
  <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4h4"/>
  <text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter, sans-serif">15</text>
{%- elif name == "fwd15" -%}
  <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M20 3.5v4h-4"/>
  <text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter, sans-serif">15</text>
{%- elif name == "prev" -%}
  <path d="M18 6v12L9 12z" fill="currentColor" stroke="none"/><path d="M6.5 6v12"/>
{%- elif name == "next" -%}
  <path d="M6 6v12l9-6z" fill="currentColor" stroke="none"/><path d="M17.5 6v12"/>
{%- elif name == "moon" -%}
  <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
{%- elif name == "more" -%}
  <circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>
{%- elif name == "list" -%}
  <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/>
{%- elif name == "text" -%}
  <path d="M4 6h16M4 10h16M4 14h11M4 18h8"/>
{%- elif name == "chevron-down" -%}
  <path d="M6 9l6 6 6-6"/>
{%- elif name == "close" -%}
  <path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "plus" -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == "home" -%}
  <path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>
{%- elif name == "library" -%}
  <path d="M5 4v16M10 4v16"/><path d="M14.5 4.5l5 15"/>
{%- elif name == "trash" -%}
  <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/>
{%- elif name == "book" -%}
  <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>
{%- elif name == "voice" -%}
  <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
{%- elif name == "jump" -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "logout" -%}
  <path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/>
{%- elif name == "upload" -%}
  <path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>
{%- elif name == "chevron-left" -%}
  <path d="M15 6l-6 6 6 6"/>
{%- elif name == "download" -%}
  <path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>
{%- elif name == "downloaded" -%}
  <circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="M8 12.5l2.8 2.8L16.5 9.5" stroke="#121212" stroke-width="2.4"/>
{%- elif name == "offline" -%}
  <path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.3-1.7M2 9.5a15 15 0 0 1 4.4-2.8M22 9.5A15 15 0 0 0 10.7 5.6"/><circle cx="12" cy="20" r="0.6" fill="currentColor"/>
{%- elif name == "image" -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>
{%- endif -%}
</svg>
{%- endmacro %}
